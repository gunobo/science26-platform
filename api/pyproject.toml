[project]
name = "science26-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "cryptography>=43",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "pyaxmlparser>=0.3.31",
  "segno>=1.6",
  # 슬림 이미지에 시간대 데이터가 없을 수 있어서 (관리자 화면 오늘 집계)
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

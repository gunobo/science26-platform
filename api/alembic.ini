[alembic]
script_location = alembic
# alembic 콘솔 스크립트는 현재 폴더를 import 경로에 넣지 않아서 app 패키지를 못 찾는다
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

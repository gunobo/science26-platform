# 학생 스택이 없거나 슬립 중일 때 /students/{링크이름} 요청을 받는 폴백 라우터.
# 학생 라우터(priority 1000+)보다 항상 낮다. API가 깨우기 잡을 넣고 "깨우는 중" 페이지를 돌려준다.
http:
  routers:
    students-fallback:
      rule: "PathPrefix(`/students/`)"
      priority: 1
      service: s26-api@docker
      middlewares: [students-wake-rewrite]
  middlewares:
    # 모든 학생 라우터에 붙는다. 학생 페이지는 한 도메인을 같이 쓰므로,
    # 한 학생의 서비스 워커가 사이트 전체(전시관·다른 학생 페이지)를 가로채지 못하게
    # 범위를 넓히는 Service-Worker-Allowed 응답 헤더를 지운다 (빈 값 = 삭제).
    student-response-headers:
      headers:
        customResponseHeaders:
          Service-Worker-Allowed: ""
    # 학생 페이지를 '열 때'(Sec-Fetch-Dest: document)만 붙는다. API 가 세션 쿠키로 방문자를 센다.
    # 이미지·JS·fetch 요청은 거치지 않는다.
    student-visit:
      forwardAuth:
        address: "http://s26-api:8000/api/v1/public/visit"
        authRequestHeaders: ["Cookie", "User-Agent"]
        addAuthCookiesToResponse: ["__Host-s26v"]
    students-wake-rewrite:
      replacePathRegex:
        regex: "^/students/([a-z0-9-]{1,32}).*"
        replacement: "/api/v1/public/wake/$1"
